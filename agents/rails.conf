# Safety rails. Explained in agents/rails.md. Checks read this file from the
# base branch, so a PR cannot loosen the rails it is checked against.
# One key=value per line. Lists are space-separated GitHub logins.

# People who decide: they assign work to the maintainer, approve risky changes,
# and can stop the agents.
owners={{HUMAN}}

# The maintainer agent's own GitHub account.
maintainer={{MAINTAINER}}

# A PR bigger than this needs an owner to add the `large-ok` label.
max_changed_lines=400
max_changed_files=20

# Most PRs the maintainer may merge in one UTC day.
max_merges_per_day=5
